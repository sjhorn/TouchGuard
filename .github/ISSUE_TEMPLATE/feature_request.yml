name: Feature request
description: Suggest an idea for TouchGuard
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "When I use an external keyboard…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like TouchGuard to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
