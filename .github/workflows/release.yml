name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Which release to make
        type: choice
        options: [appstore]
        default: appstore

permissions:
  contents: write

defaults:
  run:
    shell: bash  # -eo pipefail, so xcodebuild failures aren't hidden by xcbeautify

jobs:
  devid:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the build number is the commit count

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install signing certificate and keys
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/ci-setup-signing.sh

      - name: Build, notarise and sign the update
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          version=${GITHUB_REF_NAME#v}
          ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8 SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle_ed_key \
            scripts/release.sh devid "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$VERSION" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(v)}\][^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else "")
          PY
          gh release create "$GITHUB_REF_NAME" "build/release/devid/TouchGuard-$VERSION.dmg" \
            --title "TouchGuard $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Commit the appcast to master
        run: |
          cp docs/appcast.xml "$RUNNER_TEMP/appcast.xml"
          git fetch origin master
          git checkout -B master origin/master
          cp "$RUNNER_TEMP/appcast.xml" docs/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "Appcast: TouchGuard $VERSION"
          git push origin master

      - name: Remove signing keychain
        if: always()
        run: scripts/ci-setup-signing.sh --cleanup

  appstore:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'appstore'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: scripts/ci-setup-signing.sh --asc-key-only

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8 scripts/release.sh appstore

      - name: Remove keys
        if: always()
        run: scripts/ci-setup-signing.sh --cleanup
